<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QPH CRM · Quick Path Horizon</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <img src="logo.png" alt="Quick Path Horizon">
    <h1>CRM Login</h1>
    <p class="muted">Demo mode: pick a team member to see their dashboard.</p>
    <div id="loginUsers" class="login-users"></div>
    <div class="demo-note">Demo build · data stays in this browser only</div>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-logo"><img src="logo.png" alt="Quick Path Horizon"><span class="demo-tag">Demo</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="me" id="me"></div>
      <button class="btn btn-sm" id="logoutBtn">Switch user</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu" id="menuBtn" aria-label="Menu"></button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="search"><input id="q" placeholder="Search name, phone, campaign…"></div>
      <button class="icon-btn bell" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="bellCount"></span></button>
      <button class="btn btn-primary" id="addLeadBtn">+ Create lead</button>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div class="drawer-bg" id="drawerBg"><aside class="drawer" id="drawer"></aside></div>
<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
